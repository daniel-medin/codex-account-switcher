name: Build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodexAccountSwitcher.sln

      - name: Build
        run: dotnet build CodexAccountSwitcher.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodexAccountSwitcher.sln --configuration Release --no-build
